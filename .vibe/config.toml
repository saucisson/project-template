default_agent = "smart-approve"
outside_workdir = "deny"
applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.bash]
permission = "ask"
allowlist = [
    "basename",
    "cat",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "docker build",
    "docker images",
    "docker inspect",
    "docker logs",
    "docker ps",
    "docker tag",
    "du",
    "file",
    "find",
    "fmt",
    "fold",
    "git add",
    "git branch",
    "git checkout",
    "git commit",
    "git diff",
    "git fetch",
    "git log",
    "git push",
    "git rebase",
    "git show",
    "git stash",
    "git status",
    "git switch",
    "git tag",
    "gitleaks",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "make",
    "md5sum",
    "more",
    "mypy",
    "nl",
    "od",
    "paste",
    "pre-commit run",
    "pwd",
    "pytest",
    "python",
    "python3",
    "readlink",
    "rg",
    "ruff",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "uname",
    "uniq",
    "uv build",
    "uv export",
    "uv lock",
    "uv run",
    "uv sync",
    "uv tree",
    "uvx",
    "wc",
    "which",
]
denylist = [
    "sudo",
    "rm -rf /",
]
