name: continuous-integration

on:
  push:
    branches: [main, daily]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv and pin Python 3.15
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: english-only front
        run: uv run python -m scripts english-only

      - name: Ruff lint (temporary diagnostics, revert before merge)
        run: uv run ruff check . --output-format=github --exit-zero

      - name: Ruff format check (temporary diagnostics, revert before merge)
        run: |
          uv run ruff format --check . > /tmp/fmt.txt 2>&1; fmt_status=$?
          if [ "$fmt_status" -ne 0 ]; then
            grep '^Would reformat: ' /tmp/fmt.txt | sed 's/^Would reformat: //' | while IFS= read -r f; do
              echo "::error file=$f,line=1,title=ruff-format::ruff format would reformat $f"
            done
          fi
          exit 0

      - name: mypy strict (temporary diagnostics, revert before merge)
        run: |
          uv run mypy tools/notify/src tools/notify/tests scripts > /tmp/mypy.txt 2>&1; mypy_status=$?
          while IFS= read -r line; do
            f=$(printf '%s' "$line" | cut -d: -f1)
            n=$(printf '%s' "$line" | cut -d: -f2)
            m=$(printf '%s' "$line" | cut -d: -f3-)
            case "$f" in
              *.py) echo "::error file=$f,line=${n:-1}::${m:-$line}" ;;
            esac
          done < /tmp/mypy.txt
          exit 0

      - name: import-linter onion contract
        run: uv run lint-imports

      - name: pytest with coverage floor
        run: uv run pytest

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action to read pull request history.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: pip-audit of the locked graph
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --output-file requirements.txt
          uvx pip-audit --requirement requirements.txt --strict


      - name: Sync the locked environment
        run: uv sync --locked

      - name: License gate of the locked graph
        run: uv run python -m scripts license-gate
