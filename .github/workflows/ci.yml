name: continuous-integration

on:
  push:
    branches: [main, daily]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv and pin Python 3.15
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy tools/notify/src tools/notify/tests scripts

      - name: import-linter onion contract
        run: uv run lint-imports

      - name: pytest with coverage floor
        run: uv run pytest

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action to read pull request history.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: pip-audit of the locked graph
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --output-file requirements.txt
          uvx pip-audit --requirement requirements.txt --strict


      - name: Sync the locked environment
        run: uv sync --locked

      - name: License gate of the locked graph
        env:
          # N2 (ADR-0008): the license set is configuration, not
          # constitution; the community-validation judgment lives in
          # the pull request evidence, this gate just fails closed.
          ALLOWED_LICENSES: >-
            MIT;MIT License;Apache-2.0;Apache 2.0;Apache License
            2.0;Apache Software License;BSD-2-Clause;BSD-2-Clause
            License;BSD-3-Clause;BSD-3-Clause License;BSD License;BSD;ISC;ISC
            License;MPL-2.0;MPL 2.0;Mozilla Public License 2.0 (MPL
            2.0);Python Software Foundation License
        run: >-
          uv run --with pip-licenses python -m piplicenses
          --allow-only "$ALLOWED_LICENSES"
